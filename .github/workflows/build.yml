name: Build

# Check build for every branch push and pull request. Releases are published only by release.yml (tags v*).
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .java-version
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: torch-automation
          path: build/libs/*.jar
