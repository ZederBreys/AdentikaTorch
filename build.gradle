plugins {
    id "fabric-loom" version "1.7-SNAPSHOT"
}

// core's source sets must exist before the jar task below references them
evaluationDependsOn(":core")

base {
    archivesName = project.archives_base_name
    version = project.mod_version
    group = project.maven_group
}

allprojects {
    repositories {
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = "UTF-8"
        it.options.release = 21
    }
}

repositories {
    maven {
        name = "Meteor Dev Releases"
        url = "https://maven.meteordev.org/releases"
    }
    maven {
        name = "Meteor Dev Snapshots"
        url = "https://maven.meteordev.org/snapshots"
    }
}

dependencies {
    // Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Meteor
    modImplementation "meteordevelopment:meteor-client:${project.meteor_version}"

    // Baritone API: provided at runtime by the player's Baritone mod, never bundled
    modCompileOnly "meteordevelopment:baritone:${project.baritone_version}"

    // Core logic (plain Java), packed into the addon jar
    implementation project(":core")
}

tasks {
    processResources {
        def propertyMap = [
            "version"   : project.version,
            "mc_version": project.minecraft_version,
        ]

        inputs.properties(propertyMap)
        filesMatching("fabric.mod.json") {
            expand(propertyMap)
        }
    }

    jar {
        dependsOn(":core:classes")
        from(project(":core").layout.buildDirectory.dir("classes/java/main"))

        from("LICENSE") {
            rename { "${it}_${project.base.archivesName.get()}" }
        }
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
}
